name: CI

# Build gate for pull requests and main. Publishing stays in publish.yml
# (manual); this just proves the package compiles and packs cleanly.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Behavioral gate: the binding-contract and server-boot tests exercise
      # the engine surface this server uses, so a dependabot bump of
      # @infino-ai/infino fails here if a release changes behavior, not just
      # types.
      - run: npm test
      # Same validation the publish workflow's dry run relies on: the tarball
      # assembles with the expected contents.
      - run: npm pack --dry-run
